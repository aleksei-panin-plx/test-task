# Prompt for image models that take reference images (stage 4, user decisions 2026-11-03):
# GPT Image, Nano Banana, FLUX 3, Seedream, Qwen-Image via OpenRouter and the Codex image tool.
# The style block describes the 160 reference cards (agent review, 2026-11-03); references are
# labelled by role and image number; a detail budget keeps thumbnails readable (user: too many
# small details); backgrounds follow knowledge/style_profile/background_refs_v1.json.
# Placeholders use {field}; {n} is the image number(s) of a reference role.
# v2 (2026-11-04): rules from the human G2 review of kino-western-03 (docs/decisions.md):
# no props without context, no clutter, physical logic, readable materials, contrast with the
# backdrop, whole object in frame, no downward orientation.
# v3 (2026-11-04): rules from the second G2 round of kino-western-03: the whole main object
# inside the safe zone top and bottom, a single support line for categories 2-3, no repeated
# environment elements.

version = "ref-v3"

[blocks]
style = "A collectible object card for a casual mobile game, in the exact art style of the reference cards: smooth hand-painted 3D look with softly rounded bevelled edges, clean gradients on every surface and soft broad highlights, bright frontal top light with gentle ambient occlusion, cheerful clean colours, no outlines and no photographic textures."
object = "Main subject: {object_description}. It plays this role in the set: {theme_rationale}"
functional = "The object is shown at true scale in the way it is really used or mounted."
detail = "Keep the object simple: 3 to 6 large readable shapes and broad smooth surfaces; add a small detail only when it is needed to recognise the object; avoid engraving, rivets, tiny props and busy textures, on the object and in the backdrop alike. Everything must read clearly at 215x240 pixels."
clean = "Show only the main object and the parts it really has. Add a supporting element only when it explains how the object is used, at most one or two; no decorative extras, scattered props or theme stickers. Never repeat an element: one lamp, one spotlight, one prop of each kind."
logic = "Everything is physically logical: supports, platforms, rails and wheels are complete, plausible and made of fitting materials, and anything that runs out of the frame (rails, roads, cables) continues naturally to the edge. Each material reads as itself: fabric soft and draped, film a glossy perforated strip, metal smooth with crisp highlights, wood with painted grain."
composition = "One central subject in a slight three-quarter view, filling about two thirds of the frame, sitting in the upper-centre area and clear of the top {top_pct}% and bottom {bottom_pct}% of the frame. Every part of the main object, from its top to its feet or base, stays inside this safe zone with a clear margin; nothing is cut off or touches the frame edge. It sits level or points slightly upward or sideways, never downward. Portrait composition."
constraints = "Design rules: {rules}."
fix = "Correction for this attempt: {fix_instruction}"
tail = "Clean unbranded artwork with no added captions, watermarks, frame or interface."

[blocks.category]
1 = "Category 1: the object floats freely in front of a flat graphic backdrop, with no floor, stand or cast floor shadow."
2 = "Category 2: the object stands on a simple plain surface strip at the bottom; the surface and the vertical backdrop behind it are clearly separated by one straight line, the surface seen from slightly above; no second edge, step or rim splits the picture into three bands."
3 = "Category 3: the object sits on a simple realistic {surface} surface that shows how it is used; the surface and the vertical backdrop behind it are clearly separated by one straight line and correctly oriented; no second edge, table rim or step splits the picture into three bands."
4 = "Category 4: the object stays central in its own simple {environment} surroundings with few details; the category is obvious at a glance."

[blocks.setting]
background = "Background: a {color} backdrop, moderately desaturated and light, less saturated than the object and clearly contrasting with it in colour and value — {motif_text}."
gradient = "Background: a {color} backdrop, moderately desaturated and light, clearly contrasting with the object — {motif_text}."
scene = "Surroundings: {motif_text}, overall {color} tone."

[blocks.references]
style = "Image {n}: style reference — copy its rendering, lighting, palette and level of detail, not its object."
category = "Image {n}: category reference — copy how the object relates to the backdrop or surface and the framing, not its object."
material = "Image {n}: material reference — copy how materials are painted, not its shape or subject."
background = "Image {n}: background reference — copy only the backdrop pattern type, its two-tone contrast and the lighter centre, recoloured to the requested colour; ignore any blurred leftover shapes."

[dialects.ref-v1]
order = ["style", "category", "object", "functional", "detail", "clean", "logic", "setting", "composition", "constraints", "references", "fix", "tail"]
joiner = "\n"
