[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Folder 2: CardForge server. Its own copy of the core (`src/cardforge/`, synced by
# scripts/sync_core.py, docs/core-sync.md) plus `server/`; no dependency on folder 1.
# The server adds no Python dependencies: HTTP, MCP and the index are stdlib.
[project]
name = "cardforge-server"
version = "0.1.0"
description = "CardForge server: MCP over Streamable HTTP, run queue and gate pages over the CardForge core"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1", "pillow>=13,<14", "python-dotenv>=1.1,<2", "psutil>=7,<8", "pyyaml>=6,<7"]

[project.optional-dependencies]
api = ["google-genai>=1.0,<3"]
# Kept identical to the core's extras so the lock stays the core's lock (Apple Silicon only, never on Linux).
local = ["mflux==0.24.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
analysis = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.12,<5",
    "pyyaml>=6,<7",
    "rembg[cpu]>=2.0.70,<3",
    # Cross-platform OCR: on Linux the core uses RapidOCR (`[ocr] engine = auto`).
    "rapidocr-onnxruntime>=1.4,<2",
]
evaluation = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.12,<5",
    "torch>=2.15,<3",
    "transformers>=5.22,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cardforge", "server"]

[tool.uv]
# rapidocr pulls the GUI `opencv-python`; the core uses the headless build of the same cv2.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# CPU-only torch outside macOS: the server container has no GPU and no CUDA wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[project.scripts]
cardforge = "cardforge.cli:app"
cardforge-server = "server.app:main"
cardforge-worker = "server.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests", "tests_server"]
markers = ["api: real provider request, manual opt-in", "gpu: real GPU workload, manual opt-in", "slow: long-running check"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cardforge", "server", "helpers"]
