# OpenRouter judge candidates (Generator Architecture §4.1). Separate cumulative ledger: $15,
# raised 2026-11-03 by the user (+$16.42 balance, may be spent fully) to $27 conservative;
# then to $30.2 so the ledger matches the actual remaining balance ($5.17 left at $25.22 accounted);
# then to $41.2 on 2026-11-03 (user top-up, $11.77 balance at $29.48 accounted);
# then to $52.0 on 2026-11-04: user «правь журнал и бюджет АПИ - сейчас 11 долларов ,
# приплюсуй к бюджету» — $41.01 accounted + $11.00 balance, rounded down;
# then to $73.4 on 2026-11-04: user «я пополнил бюджет АПи на $20 - сейчас на аккаунте
# ОпенРоутер $24.01 для последующих фаз» — $49.48 accounted + $24.01 balance, rounded down;
# then to $73.8 on 2026-11-05: user «сейчас на балансе ОперРоутера $16.46 - на эту сумму
# разрешаю работы с вызовом апи необходимых моделей» — $57.35 accounted + $16.46 balance, rounded down;
# then to $104.3 on 2026-11-05: user «я доложил средства - сейчас на аккаунте $41.73»,
# approved 385 new renders + one judge pass — $62.62 accounted + $41.73 balance, rounded down;
# then to $155.7 on 2026-11-06: user «Счет Опен Роутор я пополнил - сейчас там $56.01», approved
# the whole Fable plan (docs/research/fable-review.md) — $99.72 accounted + $56.01, rounded down;
# then to $176.2 on 2026-11-09: user «пополнил баланс Опен Роутер - сейчас на балансе $38.38» —
# $137.88 accounted + $38.38, rounded down (shadow-03 keeps its own $12 cap);
# every call pins one provider, no fallbacks, ZDR, data_collection=deny. Prices are the
# pinned endpoint's per-token USD from /api/v1/models/<id>/endpoints on 2026-11-02.
# A provider/model change is a new judge and a new calibration.
[openrouter]
budget_usd = 1000000.0
authorized_max_usd = 1000000.0
ledger = "runs/_api/openrouter-ledger.json"
base_url = "https://openrouter.ai/api/v1"
price_verified_date = "2026-11-02"
price_valid_through = "2026-11-30"
# false in folder 1 (scripts/build_dist.py, user 2026-11-10): designers are never stopped by the date.
enforce_price_dates = false
# false in folder 1 (user 2026-11-10 «Да, убрать»): no per-machine ledger ceiling for designers; the
# ledger still journals every call, the OpenRouter key limit caps the spend.
enforce_ledger_cap = false
max_input_tokens_ceiling = 60000
max_output_tokens = 16384
reasoning_effort = "low"
forbidden_providers = ["openai", "azure"]

