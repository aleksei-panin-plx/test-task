[judges.none]
provider = "none"
model = "-"
profile = "-"
enabled = true
note = "No automatic judge: cards passing hard checks are flagged for G2."

[judges.fake]
provider = "fake"
model = "fake-judge-a"
profile = "rubric7-runtime-v1"
enabled = true
decision_policy = "definite-failure-first-v1"
test_only = true
note = "Scripted offline judge for tests and `cardforge demo`; not evidence of quality."

[judges.fake-strict]
panel = true
provider = "fake"
model = "fake-judge-b"
profile = "rubric7-runtime-v1"
enabled = true
decision_policy = "definite-failure-first-v1"
test_only = true
fake = { fix_rate = 25, salt = "strict" }
note = "Fake judge that asks for fixes more often; exercises disagreement in the panel."

[judges.fake-lenient]
panel = true
provider = "fake"
model = "fake-judge-c"
profile = "rubric7-runtime-v1"
enabled = true
decision_policy = "definite-failure-first-v1"
test_only = true
fake = { flag_rate = 15, salt = "lenient" }
note = "Fake judge that is unsure about style now and then."

[judges.claude-v6]
provider = "host-agent"
model = "claude-opus-5-5"
profile = "v6"
enabled = false  # host-agent judging is wired at stage 7 (skill)
decision_policy = "definite-failure-first-v1"
admitted = ["host-agent:claude-code:claude-opus-5-5"]
note = "Claude judge admitted by stage 2 (docs/stages/02-evaluation.md)."

# Batch judges for candidate groups (`kind`): `group` ranks the N candidates of one card
# position, `absolute` judges each candidate. They run in candidate mode only.
[judges.fake-g1]
provider = "fake"
kind = "group"
model = "fake-g1"
profile = "pairwise-group-v1-fake"
candidates = 4
enabled = true
test_only = true
note = "Offline stand-in for Kimi G1."

[judges.fake-sol]
provider = "fake"
kind = "absolute"
model = "fake-sol"
profile = "v5-fake"
enabled = true
test_only = true
note = "Offline stand-in for Codex gpt-6.1-sol."

[judges.kimi-g1]
provider = "openrouter"
kind = "group"
model = "moonshotai/kimi-k3.1-pro"
route = "moonshotai/mxfp4"  # provider.only, allow_fallbacks=false, zdr, data_collection=deny
profile = "pairwise-group-v1"
decision_policy = "G1: top within-group win rate (ties) AND mean ship_as_is >= 4 over >= 2 valid v6-scored passes"
candidates = 4  # calibrated on groups of 4; another N is an uncalibrated profile
ship_floor = 4.0
estimate_per_item_usd = 0.14  # stage-4 smoke 2026-11-03: ~$0.023/request, ~$0.55 per group of 4 (holdout 48: ~$0.34)
enabled = true
note = "Calibrated: development kappa 0.625/48, holdout 0.841/45 (config/evaluation.toml [[alternative_judges]]). Paid; spends the OpenRouter ledger."

# Phase 2 of the judge autonomy strategy (2026-11-04): Kimi K3.1 Pro «veto only» from
# judge-research experiment 1 as a per-card SHADOW judge. Same model, pinned route, frozen
# checklist prompt/schema (`defect-checklist-v1`), roles-v1 references and rule `veto_only`
# (not reject iff no defect) as exp1, so docs/research/judges-quality.md §7–8 numbers stay
# comparable. Logged per attempt (`<attempt>/judges/kimi-veto.json`: defects → fixes.toml
# codes); it never changes a card decision. Must be named: `--shadow-judge kimi-veto`.
[judges.kimi-veto]
provider = "openrouter"
kind = "veto"
model = "moonshotai/kimi-k3.1-pro"
candidate = "kimi-k3.1-pro"  # config/evaluation.toml [[openrouter.candidates]]
route = "moonshotai/mxfp4"  # provider.only, allow_fallbacks=false, zdr, data_collection=deny
profile = "defect-checklist-v1"
decision_policy = "veto_only"
reasoning_effort = "high"
# Reservation per call: exp1 maxima 2960 prompt / 4596 completion tokens → ≈ $0.098 ceiling;
# observed ≈ $0.023 per call (61 calls, max $0.052).
max_input_tokens_ceiling = 8000
max_output_tokens = 8192
max_cost_usd = 3.0
enabled = true
note = "Shadow only. Exp1 veto vs human majority, lenient: kappa 0.40-0.41 [0.16; 0.62], 51-59 cards; gate 0.6 not passed."

[judges.fake-veto]
provider = "fake"
kind = "veto"
model = "fake-veto"
profile = "defect-checklist-v1"
decision_policy = "veto_only"
enabled = true
test_only = true
fake = { veto_rate = 30, salt = "veto" }
note = "Offline stand-in for kimi-veto (FakeLLM step veto_checklist)."

# Look items behind a flag (2026-11-06, docs/research/generation-defects.md §7.6): the same
# v1 checklist, route and references as kimi-veto plus two questions at the end — «материал
# нарисован как в референсах?» (`material_style`) and «блики и свет как в референсах?»
# (`highlights_light`), src/cardforge/evaluate/look_checklist.py. A new judge: uncalibrated, the
# look items never veto (signal only). Off until the relabel-03 calibration is agreed:
# switch `enabled = true` and name it with `--shadow-judge kimi-veto-look`.
[judges.kimi-veto-look]
provider = "openrouter"
kind = "veto"
model = "moonshotai/kimi-k3.1-pro"
candidate = "kimi-k3.1-pro"
route = "moonshotai/mxfp4"
profile = "defect-checklist-v1+look-v1"
decision_policy = "veto_only"
reasoning_effort = "high"
max_input_tokens_ceiling = 8000
max_output_tokens = 8192
max_cost_usd = 1.5
enabled = false
note = "Shadow only, uncalibrated. Look items are signal only (never veto)."

[judges.fake-veto-look]
provider = "fake"
kind = "veto"
model = "fake-veto"
profile = "defect-checklist-v1+look-v1"
decision_policy = "veto_only"
enabled = true
test_only = true
fake = { veto_rate = 30, salt = "veto" }
note = "Offline stand-in for kimi-veto-look (FakeLLM step veto_checklist)."

# Step 0 of auto-reject (2026-11-06, docs/research/fable-review.md §3.4, config/auto_reject.toml):
# the phase-4 / blind-labels-02 contract of Kimi v2 — checklist `defect-checklist-v2` (prompt
# byte for byte, sha256 in veto_judge.V2_PROMPT_SHA256), same model, pinned route, settings
# and roles-v1 references. Its admitted items (style_mismatch ∨ downward: 43/44 on the blind
# labels) turn the card into `fix`; all other items stay shadow. Must be named:
# `--shadow-judge kimi-veto-v2` (≈ $0.024 per card, observed on blind-labels-02).
[judges.kimi-veto-v2]
provider = "openrouter"
kind = "veto"
model = "moonshotai/kimi-k3.1-pro"
candidate = "kimi-k3.1-pro"
route = "moonshotai/mxfp4"
profile = "defect-checklist-v2"
decision_policy = "veto_only"
reasoning_effort = "high"
max_input_tokens_ceiling = 8000
max_output_tokens = 8192
max_cost_usd = 3.0
enabled = true
# J4 (user 2026-11-09, autonomy-readiness §8 п. 4): in shadow runs ask Kimi only on the style
# scorer's grey zone, min_p ≤ p < τ_r of the card's profile (where a person looks anyway).
# A card without a style score is still asked. runs = "all" would gate every run.
style_gate = { min_p = 0.3, runs = "shadow" }
note = "Step-0 auto-reject judge (admitted items only); other items shadow. Blind-labels-02: style_mismatch 28/28, downward 16/17."

[judges.fake-veto-v2]
provider = "fake"
kind = "veto"
model = "fake-veto"
profile = "defect-checklist-v2"
decision_policy = "veto_only"
enabled = true
test_only = true
fake = { veto_rate = 30, salt = "veto" }
note = "Offline stand-in for kimi-veto-v2 (FakeLLM step veto_checklist)."

[judges.codex-sol]
provider = "host-cli"
kind = "absolute"
model = "gpt-6.1-sol"
profile = "v5"
decision_policy = "definite-failure-first-v1"
enabled = true
note = "Codex CLI on the ChatGPT subscription (no paid OpenAI API); calibrated v5 campaign 23+24, kappa 0.703/43 (config/evaluation.toml working_judges)."

[judges.gemini-flash]
provider = "gemini"
kind = "card"
model = "gemini-3.8-flash"
profile = "rubric7-human-guidance-v2"
enabled = false  # calibration paused, kappa >= 0.6 not passed; no gemini adapter in the core
decision_policy = "definite-failure-first-v1"
note = "config/evaluation.toml [gemini]."

# Two deciding judges are combined by one named rule (no "best judge" selection):
# pick-and-confirm — the group judge's pick that the absolute judge also accepts is
# accepted; only one of them accepts → flag for G2 with both verdicts; neither → regenerate.
[decision]
rule = "pick-and-confirm"

[deployment.local]
backends = ["fake", "google", "mflux", "openrouter-image", "codex"]
llm_providers = ["host-agent", "fake"]
# By provider, so connecting a new judge needs only its [judges.<id>] table.
judge_providers = ["none", "fake", "host-agent", "host-cli", "gemini", "openrouter"]
gate_channels = ["cli"]

[deployment.server]
backends = ["fake", "google", "openrouter-image"]
llm_providers = ["host-agent", "fake"]  # server copy (core-sync.toml): the user's agent over MCP
judge_providers = ["none", "fake", "gemini", "openrouter"]
gate_channels = ["mcp", "web"]

# Set-level checks after the cards of a variant are accepted (stage 4, user 2026-11-05).
# Warnings only: an outlier makes the set `warn` in sets/<variant>.json and the report,
# it never rejects a card. Calibration: docs/stages/04-prototype.md «Проверки уровня сета».
[set_qa]
style_metric = "csd"  # CSD primary; DINOv2 caught 0/81 matched-object swaps at these limits
min_cards = 4
# A card is a style outlier when its leave-one-out distance to the other cards is at or
# above this percentile of the same distances inside the real catalog sets AND its robust
# z-score within the set (median/MAD) is at least `outlier_robust_z`.
outlier_percentile = 95.0
outlier_robust_z = 2.0
# TA §11.6: set dispersion ≤ this percentile of real-set dispersions.
dispersion_percentile = 95.0

# VLM review of the numbered 5×2 sheet of accepted cards, once per complete variant
# (all its cards accepted/rejected/failed). FakeBackend runs always use the fake reviewer;
# runtime option `set_sheet = "none"` or enabled = false switches the paid call off.
[set_qa.sheet]
enabled = true
provider = "openrouter"
candidate = "kimi-k3.1-pro"  # config/evaluation.toml [[openrouter.candidates]]
route = "moonshotai/mxfp4"  # provider.only, allow_fallbacks=false, zdr, data_collection=deny
reasoning_effort = "low"
max_input_tokens_ceiling = 6000
max_output_tokens = 6000
max_cost_usd = 1.0  # per run, kind llm:set_sheet_review
min_cards = 4
