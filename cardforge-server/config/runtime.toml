fallback = "or-nano-banana-v2"  # G1 reserve (2026-11-09)
backend = "openrouter-image"
model_id = "openai/gpt-image-2.5-sunburst"
allow_openai = true
endpoint = "images"
send_seed = false
aspect_ratio = "3:4"
extra = { quality = "medium" }
send_references = true
max_refs = 6
template = "prompts/render/ref-v6.toml"  # 2026-11-06: user made ref-v6 the default (A/B 14:9 n.s., not worse)  # phase 3, 2026-11-04: user chose ref-v4 for set (в) despite the A/B (ref-v3 6/8 vs ref-v4 2/8 not rejected), then «Сделать ref-v5 сейчас»
dialect = "ref-v1"
