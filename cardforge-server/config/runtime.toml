# Stage-4 core runtime: render profiles, judge profiles and deployment profiles
# (TA §7.3, §10.3, §11.3, §13.4). Paths are relative to the project root unless the
# CARDFORGE_* environment variables override them (see orchestrator/workspace.py).
schema_version = 1

[defaults]
llm_provider = "host-agent"
# No working judge is chosen by the core: stage 2 is still open (Gemini failed κ ≥ 0.6,
# the Kimi G1 profile awaits the user's decision). Without a judge every card that passes
# the hard checks goes to G2, so `judge = "none"` requires a human G2 gate.
judge_profile = "none"
# Judge panel (user, 2026-11-03): every enabled judge below gets the same card task at the
# same time; each answer is saved on its own (cards/.../attempt_NN/judges/<id>.json) and is
# never merged or rewritten. Only `judge_profile` decides; the others are logged for
# comparison. Adding a judge = a new [judges.<id>] table; switching one off = enabled = false.
# There is deliberately no rule that picks a "best" judge from the answers.
judge_concurrency = 4
# T2 (2026-11-10): request slots per paid provider shared by all runs on the machine
# (runs/_api/slots/openrouter); 0 switches the machine-wide limit off.
provider_concurrency = 4
api_concurrency = 4
# Main generators (user, 2026-11-04: «в основе использовать те генераторы, которые мы
# используем сейчас - особенно gpt, nana banana - пока к локальному flux н будем
# возвращаться»). `--render primary` expands to this list; other OpenRouter models stay
# available by name. Every one of them spends the OpenRouter ledger.
# 2026-11-04: GPT Image 2.1 is not on OpenRouter; the user chose 2.5 («Перейти на 2.5»).
# 2026-11-06: user added GPT Image 2.6 as a third main generator «какое-то время» (impression:
# follows references and the description better; gpt26-ab A/B was 10:8, inconclusive, ≈1.6× cost).
# 2026-11-06: GPT 2.6 dropped per fable-review §5 (user approved).
# 2026-11-09 (user «Все пять как рекомендовано», autonomy-readiness §8 G1): Nano Banana is a
# reserve, not a main generator. It is used only when chosen by name (`--render
# or-nano-banana-v2`) or as the per-card reserve of GPT (`fallback` of the profile below): a
# card whose GPT attempts failed `fallback_after_failures` times in a row gets its next attempt
# on Nano. 2026-11-09 (user «Да, так»): a failure is only a reject by a person (G2), a judge or
# the style scorer / step-0 auto-reject; hard checks (crop, safe_zone, fill, text) are neutral
# (shadow-02: 9 of 40 noir cards went to Nano on crop/safe_zone alone; R1 accepted 17 of their
# 18 GPT images and rejected 5 of 9 Nano ones). `--no-render-fallback`
# and comparison runs (`--compare-models`) switch the reserve off.
primary_render_profiles = ["or-gpt-image-2-5"]
fallback_after_failures = 2

# Render models (user, 2026-11-03): like judges, one or several can be chosen per run
# (`--render a --render b`). Each set variant is rendered by exactly one profile (TA §7.3);
# with several, variants are assigned round-robin and the report compares them per model.
# `enabled = false` switches a model off without a code change.

[render_profiles.fake]
enabled = true
backend = "fake"
model_id = "fake-backend-v1"
dialect = "nano-banana"
width = 864
height = 960
cost_estimate_usd = 0.0
test_only = true

[render_profiles.fake-b]
enabled = true
backend = "fake"
model_id = "fake-backend-v1b"
dialect = "nano-banana"
width = 864
height = 960
cost_estimate_usd = 0.0
test_only = true

[render_profiles.closed-nano]
enabled = false
backend = "google"
model_id = "gemini-3.1-flash-image-preview"  # config/models.toml [models.closed-nano]
dialect = "nano-banana"
width = 864
height = 960
# Placeholder until the price is verified against Google documentation before a real run.
cost_estimate_usd = 0.07
available = false  # GoogleImageBackend is not implemented yet: no paid calls in this step

[render_profiles.local-klein4b]
# Switched off 2026-11-04 by the user's choice of main generators (see primary_render_profiles);
# stage-2 calibration scripts use the weights directly and are not affected.
enabled = false
backend = "mflux"
model_id = "flux2-klein-4b"  # config/models.toml, Apache-2.0, already downloaded
template = "prompts/render/flux-g1-v1.toml"
dialect = "flux-g1"
width = 864
height = 960
steps = 4
guidance = 1.0
quantize = 4
cost_estimate_usd = 0.0

# Judge entries: provider, model, profile (rubric/prompt version), enabled. Optional:
# decision_policy, max_cost_usd (per-judge ceiling inside the run budget), admitted (for
# host-agent: answers from other hosts are flagged), test_only, fake (FakeLLM knobs).
# Image models through OpenRouter (user, 2026-11-03: try them against local FLUX). They spend
# the OpenRouter ledger; text-only unless the user consents to sending reference images.
# Prices: OpenRouter /api/v1/models on 2026-11-03 (per output image token); the estimate is
# per image and is checked against the first reported cost.
[render_profiles.or-nano-banana]
enabled = true
backend = "openrouter-image"
model_id = "google/gemini-nano-banana-2.1"
template = "prompts/render/flux-g1-v1.toml"
dialect = "flux-g1"
width = 864
height = 960
aspect_ratio = "4:5"
cost_estimate_usd = 0.05  # first calls 2026-11-03: ~$0.037 per image

[render_profiles.or-flux3]
enabled = true
backend = "openrouter-image"
model_id = "black-forest-labs/flux-3-image"
endpoint = "images"  # pure image model: /api/v1/images, not chat/completions
send_seed = false  # "FLUX 3 Image does not support: seed" (first call 2026-11-03)
template = "prompts/render/flux-g1-v1.toml"
dialect = "flux-g1"
width = 864
height = 960
aspect_ratio = "4:5"
cost_estimate_usd = 0.05

# GPT image generation through the Codex CLI built-in tool on the ChatGPT subscription
# (TA §10.5; user, 2026-11-03: «GPT (Terra)»). No API key, no paid OpenAI API; the image
# model behind the tool is not exposed. `codex_model` is the requested Codex agent model.
[render_profiles.codex-gpt-image]
enabled = false  # user 2026-11-03: subscription limits are nearly used up; GPT goes via OpenRouter
backend = "codex"
model_id = "gpt-image (Codex built-in tool)"
codex_model = "gpt-6.1-terra"  # assumed id by analogy with gpt-6.1-sol; confirm on first call
codex_effort = "medium"
template = "prompts/render/flux-g1-v1.toml"
dialect = "flux-g1"
width = 864
height = 960
cost_estimate_usd = 0.0

# Reference-aware profiles (user 2026-11-03: references allowed for all generators; GPT image
# via OpenRouter allowed for generation tests). Template ref-v1: style block from the 160
# reference cards, detail budget, role-labelled references incl. a background plate.
