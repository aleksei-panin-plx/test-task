backend = "openrouter-image"
model_id = "openai/gpt-image-2"
allow_openai = true
endpoint = "images"
send_seed = false
aspect_ratio = "3:4"  # no 4:5 for this model
extra = { quality = "medium" }
send_references = true
max_refs = 6
template = "prompts/render/ref-v1.toml"
dialect = "ref-v1"
width = 864
height = 960
cost_estimate_usd = 0.08

[render_profiles.or-gpt-image-2-5]
# doctor route probe (stage 7): a text model of the same provider (an image model would draw).
# Model id assumed; a wrong id is a doctor warning «проба не настроена», not an error.
