[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cardforge"
version = "0.0.1"
description = "Reference-driven collectible card production pipeline"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1", "pillow>=13,<14", "python-dotenv>=1.1,<2", "psutil>=7,<8", "pyyaml>=6,<7"]

[project.optional-dependencies]
api = ["google-genai>=1.0,<3"]
local = ["mflux==0.24.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
analysis = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.12,<5",
    "pyyaml>=6,<7",
    "rembg[cpu]>=2.0.70,<3",
    # Cross-platform OCR (stage 7, Windows): models ship inside the wheel, nothing is downloaded.
    "rapidocr-onnxruntime>=1.4,<2",
]
evaluation = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.12,<5",
    "torch>=2.15,<3",
    "transformers>=5.22,<6",
]

[tool.uv]
# rapidocr pulls the GUI `opencv-python`; the project uses the headless build of the same cv2.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# Stage 7 (Windows / Linux): CPU-only torch outside macOS, no CUDA wheels on designers' machines.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[project.scripts]
cardforge = "cardforge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["api: real provider request, manual opt-in", "gpu: real GPU workload, manual opt-in", "slow: long-running check"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
