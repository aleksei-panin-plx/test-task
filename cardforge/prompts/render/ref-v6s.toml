# Prompt ref-v6s (stage 4, 2026-11-06, Q4 of docs/research/fable-review.md §2): ref-v6 verbatim
# plus one reference caption for the "swatch" role (a sheet of close crops of one material's
# painted surface that replaces the whole-card material reference). Used only with the
# material-swatches flag (knowledge/material-swatches.toml); no profile uses it by default.
#
# Prompt for image models that take reference images — version ref-v6 (stage 4, 2026-11-06).
# Source: docs/research/generation-defects.md §3 and §5 (blind-labels-02: 67 % rejected; the
# user's main reasons are off-style materials, many sharp highlights, off-style light and a
# washed-out «white filter»). ref-v5 itself asked for «sharp bright specular highlights»,
# «crisp highlights», a rim light and a desaturated light backdrop. Changes against ref-v5:
# - style: no specular/rim wording; stylised 3D with a thin light line along top edges;
# - new blocks `light` and `colour`: one soft key light, one or two broad soft highlights per
#   large form, clean saturated local colours with coloured shadows, no grey haze;
# - new block `materials`: one line per material the card has (`spec.materials`); metal adds
#   gold / chrome / iron lines when the object description names them ([material_variants]);
# - `logic` without «metal smooth with crisp highlights»;
# - background: a clean saturated backdrop like the references, lighter behind the object;
# - tail: negatives against photographic chrome, varnish, many highlights and a filter look.
# Other blocks are ref-v5 verbatim. ref-v6 is opt-in: no profile in config/runtime.toml uses it.

version = "ref-v6s"

[blocks]
style = "A collectible object card for a casual mobile game, in the exact art style of the reference cards: smooth hand-painted stylised 3D with softly rounded bevelled edges and a thin light line along top edges, broad smooth gradients on every large form, no outlines, no micro texture and no photographic materials. The look is never flat vector, anime or cartoonish, never grungy, noisy or hyper-realistic, and has no harsh shadows."
light = "Light: one soft key light from the upper front. Each large form gets one smooth light-to-dark gradient and at most one or two broad, soft-edged highlights; small parts get none. Gentle ambient occlusion in creases. No rim light, no sparkles, no glints, no mirror reflections, no streaks."
colour = "Colour: every part is painted in one clean, fully saturated local colour; shadows are a deeper, warmer shade of the same colour, never grey or black. Pure darks and clean whites, no grey haze, no washed-out, muted, pastel or filtered look."
materials = "Materials: {lines}"
object = "Main subject: {object_description}. It plays this role in the set: {theme_rationale}"
functional = "The object is shown at true scale in the way it is really used or mounted."
detail = "Keep the object simple: 3 to 6 large readable shapes and broad smooth surfaces; add a small detail only when it is needed to recognise the object; avoid engraving, rivets, tiny props and busy textures, on the object and in the backdrop alike. Everything must read clearly at 215x240 pixels."
dominant = "The picture is not fragmented: it is built from a few large shapes, and the main object is clearly the dominant element — the largest, brightest and most saturated thing in the frame, readable at a glance; supports and surroundings stay simple, smaller and calmer."
form = "Keep the real form and proportions of the object as it exists, not squashed or toy-like, and draw the object, its support and its surroundings in one consistent perspective with a single camera angle and horizon."
clean = "Show only the main object and the parts it really has. Add a supporting element only when it explains how the object is used, at most one or two; no decorative extras, scattered props or theme stickers. Never repeat an element: one lamp, one spotlight, one prop of each kind."
logic = "Everything is physically logical: supports, platforms, rails and wheels are complete, plausible and made of fitting materials, and anything that runs out of the frame (rails, roads, cables) continues naturally to the edge. Each material reads as itself: fabric soft and draped, film a glossy perforated strip, wood with painted grain."
composition = "One central subject in a slight three-quarter view, filling about two thirds of the frame, sitting in the upper-centre area and clear of the top {top_pct}% and bottom {bottom_pct}% of the frame. Every part of the main object, from its top to its feet or base, stays inside this safe zone with a clear margin; nothing is cut off or touches the frame edge. It sits level or points slightly upward or sideways, never downward. Portrait composition."
constraints = "Design rules: {rules}."
fix = "Correction for this attempt: {fix_instruction}"
tail = "Clean unbranded artwork with no added captions, watermarks, frame or interface. No photographic chrome, no glossy varnish, no clusters of small highlights, no washed-out filter."

[blocks.category]
1 = "Category 1: the object floats freely in front of a flat graphic backdrop, with no floor, stand or cast floor shadow."
2 = "Category 2: the object stands on a simple plain surface strip at the bottom; the surface and the vertical backdrop behind it are clearly separated by one straight line, the surface seen from slightly above; no second edge, step or rim splits the picture into three bands."
3 = "Category 3: the object sits on a simple realistic {surface} surface that shows how it is used; the surface and the vertical backdrop behind it are clearly separated by one straight line and correctly oriented; no second edge, table rim or step splits the picture into three bands."
4 = "Category 4: the object stays central in its own simple {environment} surroundings with few details; the category is obvious at a glance."

[blocks.setting]
background = "Background: a clean saturated {color} backdrop like the reference backdrops, slightly lighter behind the object; its hue is opposite or complementary to the object's main colour, so the object's silhouette stands out clearly in colour and value — {motif_text}."
gradient = "Background: a clean saturated {color} backdrop like the reference backdrops, slightly lighter behind the object; its hue is opposite or complementary to the object's main colour, so the object stands out clearly in colour and value — {motif_text}."
scene = "Surroundings: {motif_text}, overall clean saturated {color} tone, calmer than the object; the object's main colour is opposite or complementary to this tone, so the object stands out clearly."

[blocks.references]
style = "Image {n}: style reference — copy its rendering, lighting, palette and level of detail, not its object."
category = "Image {n}: category reference — copy how the object relates to the backdrop or surface and the framing, not its object."
material = "Image {n}: material reference — copy how materials are painted, not its shape or subject."
swatch = "Image {n}: swatch — copy only how this surface is painted (colour gradients, bevels, highlights), not its shape, layout or any object."
background = "Image {n}: background reference — copy only the backdrop pattern type, its two-tone contrast and the lighter centre, recoloured to the requested colour; ignore any blurred leftover shapes."

# One line per material of the card (`spec.materials`, planner vocabulary). Materials without a
# line here (organic, food, paper, water, neon) get none. Order follows `spec.materials`.
[materials]
metal = "Metal is mostly painted enamel in a saturated colour, satin, like smooth plastic."
wood = "Wood is warm honey-orange brown, large planks or shapes with a few long soft grain strokes, rounded edges, satin, no varnish shine."
glass = "Glass is a clean flat light tint with one or two soft white streaks; lenses are deep blue with a single highlight; no refraction."
fabric = "Fabric is matte, soft large folds, saturated colour, large simple pattern only."
stone = "Stone is light cream or beige-grey, chunky rounded blocks, a few simple cracks."
leather = "Leather is smooth caramel brown with simple stitch dashes."
plastic = "Plastic is a saturated satin colour with soft highlights."
rubber = "Rubber is a matte saturated colour with soft highlights."
ceramic = "Ceramic is a smooth saturated glaze with one soft broad highlight."

# Extra lines added after a material's own line when the object description names one of the
# words (whole words, case-insensitive).
[material_variants.metal.gold]
words = ["gold", "golden", "gilded", "brass", "bronze", "copper"]
text = "Gold and brass are a warm saturated yellow-orange with orange shadows and one soft pale highlight, not a mirror."

[material_variants.metal.chrome]
words = ["chrome", "chromed", "steel", "stainless", "silver", "silvery", "aluminium", "aluminum", "nickel", "tin", "pewter", "grey metal", "gray metal"]
text = "Chrome and steel are a smooth light-to-mid grey gradient tinted by the backdrop colour, with one soft white highlight; no reflections of the surroundings, no high-contrast banding."

[material_variants.metal.iron]
words = ["iron", "cast-iron", "wrought", "black metal", "dark metal", "cast iron"]
text = "Dark iron is a deep slate blue-grey with a lighter top edge, never flat black."

[dialects.ref-v1]
order = ["style", "light", "colour", "category", "object", "materials", "functional", "detail", "dominant", "form", "clean", "logic", "setting", "composition", "constraints", "references", "fix", "tail"]
joiner = "\n"
