  "rules": [
    {
      "id": "volume",
      "statement": "Readable stylized 3D forms, rounded edges, selective material highlights; no universal plastic/gloss shader.",
      "examples": [
        "CardC6_card_17",
        "CardC6_card_53",
        "CardC6_card_58",
        "CardC6_card_69"
      ]
    },
    {
      "id": "lighting",
      "statement": "Broad bright lighting is typical; night/neon are legitimate local exceptions when form remains readable.",
      "examples": [
        "CardC6_card_45",
        "CardC6_card_58",
        "CardC6_card_113",
        "CardC6_card_125"
      ]
    },
    {
      "id": "camera",
      "statement": "Three-quarter view is common, not universal; top-down and frontal views serve object recognition.",
      "examples": [
        "CardC6_card_63",
        "CardC6_card_79",
        "CardC6_card_28",
        "CardC6_card_101"
      ]
    },
    {
      "id": "background",
      "statement": "Graphic motifs belong to isolated objects/local surfaces; context scenes may have detailed foregrounds.",
      "examples": [
        "CardC6_card_17",
        "CardC6_card_58",
        "CardC6_card_64",
        "CardC6_card_91"
      ]
    },
    {
      "id": "composition",
      "statement": "One semantic focus may be a group/accessories; all content need not be inside a single object silhouette.",
      "examples": [
        "CardC6_card_11",
        "CardC6_card_43",
        "CardC6_card_103",
        "CardC6_card_134"
      ]
    },
    {
      "id": "characters",
      "statement": "Do not treat an ordinary animal, statue or toy as a gold character narrative; gold is a separate reference pool.",
      "examples": [
        "CardC6_card_02",
        "CardC6_card_09",
        "CardC6_card_117",
        "CardC6_card_120"
      ]
    },
    {
      "id": "text",
      "statement": "Exclude added interface captions from generated art; diegetic numbers, maps, symbols and autographs exist in references.",
      "examples": [
        "CardC6_card_24",
        "CardC6_card_63",
        "CardC6_card_107",
        "CardC6_card_122"
      ]
    },
    {
      "id": "safe_zone",
      "statement": "Critical identity should avoid conservative frame envelope; cropped supports can be accepted after actual preview.",
      "examples": [
        "CardC6_card_03",
        "CardC6_card_31",
        "CardC6_card_98",
        "CardC6_card_143"
      ]
    },
    {
      "id": "fill",
      "statement": "Use audited mask area quantiles as descriptive data; do not apply 60-75% area as a universal target, do not mix bbox area with pixel area.",
      "examples": [
        "CardC6_card_17",
        "CardC6_card_33",
        "CardC6_card_61",
        "CardC6_card_97"
      ]
    }
  ],
