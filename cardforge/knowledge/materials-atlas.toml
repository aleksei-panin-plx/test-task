# Material atlas (H5, docs/research/generation-defects.md §3, §4, §7 п. 5).
#
# For each main material (and a few scene subjects: water, sky, grass, trees, flowers, cars),
# 2-3 curated reference cards from dataset/ that show how the game paints it. With the flag
# on, the "material" reference role is taken from here instead of a random catalog match.
#
# Flag: `enabled` below, or the env var CARDFORGE_MATERIAL_ATLAS=1 / 0 (env wins).
# Off by default: the ref-v6 A/B keeps references frozen.
#
# Matching (src/cardforge/knowledge/references.py, MaterialAtlas.main_material):
#   1. subjects - words in object_description / object_name naming the subject (car, clouds).
#                 The earliest such word wins over any material.
#   2. otherwise the first spec material the atlas knows:
#      aliases  - spec material tokens that mean this entry (lower case, whole token);
#      refines  - generic tokens ("metal", "organic") this entry can refine, using
#      keywords - words in the description / name; the earliest keyword wins, and with no
#                 keyword the generic token falls back to its alias ("metal" -> painted_metal).
# All words match whole words, case-insensitive.
#
# refs - card_ref in dataset/ (never category 5), best first.

version = "materials-atlas-v1"
status = "approved"   # user approved all 18 entries, 2026-11-06 («Утверждаю всё»)
enabled = false
per_card = 1       # material references per card (style 1 + category 2 + material = 4)

# --- metal ----------------------------------------------------------------------------

[materials.painted_metal]
label = "Окрашенный металл"
aliases = ["metal", "painted metal", "enamel", "tin"]
refines = ["metal"]
keywords = ["painted", "enamel", "enamelled", "enameled"]
refs = ["CardC6_card_25", "CardC6_card_42", "CardC6_card_65"]

[materials.gold]
label = "Золото, латунь"
