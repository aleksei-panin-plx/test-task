[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cardforge-lite"
version = "0.0.1"
description = "CardForge Light: collection plan (G1) and content tables for collectible item cards"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[project.scripts]
cardforge = "cardforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cardforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
